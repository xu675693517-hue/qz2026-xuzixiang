{% extends "blog/base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="card" style="max-width:420px">
  <h1>注册</h1>
  <p class="muted">
    密码由 Django 内置的 <code>set_password()</code> 做 PBKDF2 哈希后存储，不会明文落库。
  </p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">注册</button>
    <a class="btn" href="{% url 'login' %}">已有账号？去登录</a>
  </form>
</div>
{% endblock %}
